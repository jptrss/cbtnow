<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Problem Setter · CBTNow</title><meta name="robots" content="noindex">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("cbtnow-theme")||"dark"}catch{}</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2724%27 fill=%27%236366f1%27/><path d=%27M28 52l16 16 30-34%27 stroke=%27white%27 stroke-width=%2712%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/assets/theme.css">
<style>.tag.r{color:var(--r);border-color:rgba(248,113,113,.5)}.tag.y{color:var(--y);border-color:rgba(251,191,36,.5)}.mt{color:var(--mu);font-size:.85rem}.task{padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}</style></head>
<body><div class="bgfx"></div><div class="load" id="load"><i></i></div>
<div class="app"><aside id="side"></aside><main>
<section class="hero"><div><h1 id="gr"></h1><p>Problem Setter · Question writer</p><div class="nx" id="nx"></div></div><div class="clk"><div class="big mono" id="ck"></div><small id="dtx"></small></div></section>
<div class="stats" id="stats"></div>
<div class="cols c2">
<div><div class="card"><h3>My editing tasks</h3><div id="tk"></div></div>
<div class="card"><h3>Heads-up</h3><div id="at"></div></div></div>
<div><div class="card"><div class="ch"><button id="pv" aria-label="Previous month">‹</button><b id="mt"></b><button id="nt" aria-label="Next month">›</button></div><div class="cg" id="cg"></div>
<p class="em" style="padding:12px 0 0;font-size:.8rem">Exams that use your packages. <span style="color:var(--g)">●</span> live &nbsp;<span style="color:var(--ac)">●</span> upcoming &nbsp;<span style="color:var(--mu)">●</span> finished</p></div>
<div class="card"><h3 id="dh"></h3><div id="dl"></div></div>
<div class="card"><h3>Work summary</h3><div id="wk"></div></div></div>
</div></main></div><div class="toast" id="toast"></div>
<script type="module">
import{$,esc,toast,guard,shell,hero,ready,errMsg,db,NAV}from"/assets/core.js";
import{collection,getDocs,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const me=await guard("PROBLEM_SETTER");shell(me,NAV.PROBLEM_SETTER,"dash");hero(me);
const kd=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`,hm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const hms=ms=>{const s=Math.max(0,Math.round(ms/1e3)),d=Math.floor(s/86400);return(d?d+"d ":"")+[Math.floor(s%86400/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,"0")).join(":")};
const ago=t=>{const m=Math.round((Date.now()-(t||0))/6e4);return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"};
const iss=q=>{const e=[],d=document.createElement("div");d.innerHTML=q.text||"";if(!d.textContent.trim()&&!d.querySelector("img"))e.push("empty text");
if(q.type=="short"){if(!(q.answers||[]).filter(x=>x.trim()).length)e.push("no accepted answer")}else{if((q.options||[]).length<3)e.push("few options");if((q.options||[]).some(o=>!o.t.trim()&&!o.img))e.push("empty option");if(!(q.correct||[]).length)e.push("no correct answer");if(q.type=="mcq"&&q.correct.length>1)e.push("many answers")}if(!(+q.score>0))e.push("score");return e};
const stt=s=>{const n=Date.now();return n<s.startTime?"Upcoming":n>s.endTime?"Finished":"Live"};
let P=[],S=[],cy,cm,sel;{const t=new Date();cy=t.getFullYear();cm=t.getMonth();sel=kd(t)}
const bad=p=>p.questions.filter(q=>iss(q).length).length,PM=()=>Object.fromEntries(P.map(p=>[p.id,p]));
async function load(){try{P=(await getDocs(query(collection(db,"question_packages"),where("assignedSetterUids","array-contains",me.uid)))).docs.map(d=>({id:d.id,...d.data(),questions:d.data().questions||[]}));
const ids=P.map(p=>p.id).slice(0,30);S=ids.length?(await getDocs(query(collection(db,"exam_sessions"),where("packageId","in",ids)))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.startTime-b.startTime):[]}catch(x){toast(errMsg(x))}}
const row=s=>{const p=PM()[s.packageId],x=stt(s),warn=x!="Finished"&&p&&(p.status!="published"||bad(p));return`<div class="it"><div class="tx"><b>${esc(s.title)}</b><small>📦 ${esc(p?.title||"Package")} · ${hm(s.startTime)}–${hm(s.endTime)}</small>${warn?'<small style="color:var(--y)">⚠ This package isn’t ready yet</small>':""}</div><div class="ac"><span class="tag ${x=="Live"?"g":x=="Upcoming"?"a":""}">${x}</span><a class="btn s" href="/probset/question#/edit/${s.packageId}">Open</a></div></div>`};
function paint(){const q=P.reduce((a,p)=>a+p.questions.length,0),b=P.reduce((a,p)=>a+bad(p),0),pts=P.reduce((a,p)=>a+p.questions.reduce((x,y)=>x+(+y.score||0),0),0);
$("#stats").innerHTML=[["Assigned packages",P.length],["Questions written",q],["Need attention",b],["Drafts",P.filter(p=>p.status!="published").length],["Published",P.filter(p=>p.status=="published").length],["Total points",pts]].map(([l,v],i)=>`<div class="st" style="animation-delay:${i*60}ms"><b>${v}</b><span>${l}</span></div>`).join("");
const T=[...P].sort((a,b)=>bad(b)-bad(a)||(b.updatedAt||0)-(a.updatedAt||0));
$("#tk").innerHTML=T.map(p=>{const n=p.questions.length,ok=n-bad(p);return`<div class="task"><div class="rw"><b style="flex:1">${esc(p.title)}</b><span class="tag ${p.status=="published"?"g":""}">${p.status=="published"?"Published":"Draft"}</span></div><div class="mt">${n} questions · ${ok} complete${bad(p)?` · <span style="color:var(--y)">${bad(p)} need attention</span>`:""} · updated ${ago(p.updatedAt)}</div><div class="pb"><i style="width:${n?Math.round(ok/n*100):0}%"></i></div><a class="btn s p" href="/probset/question#/edit/${p.id}" style="margin-top:10px">${n?"Continue editing":"Start writing"}</a></div>`}).join("")||'<p class="em">No packages are assigned to you yet. Management will assign packages to you.</p>';
const m=PM(),A=[];S.filter(s=>stt(s)!="Finished").forEach(s=>{const p=m[s.packageId];if(!p)return;if(p.status!="published")A.push(`“${p.title}” is still a draft, but “${s.title}” ${stt(s)=="Live"?"is live now":"starts "+new Date(s.startTime).toLocaleDateString([],{day:"numeric",month:"short"})}.`);else if(bad(p))A.push(`“${p.title}” has ${bad(p)} incomplete question(s) and is used by “${s.title}”.`)});
$("#at").innerHTML=[...new Set(A)].slice(0,6).map(t=>`<div class="fd"><span>⚠️ ${esc(t)}</span></div>`).join("")||'<p class="em">All set. Nothing needs your attention.</p>';
const bar=(l,a,b)=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:.86rem"><span>${l}</span><b>${a} / ${b}</b></div><div class="pb"><i style="width:${b?Math.round(a/b*100):0}%"></i></div></div>`;
$("#wk").innerHTML=bar("Questions complete",q-b,q)+bar("Packages published",P.filter(p=>p.status=="published").length,P.length)+bar("Exams finished",S.filter(s=>stt(s)=="Finished").length,S.length);cal()}
function cal(){const f=new Date(cy,cm,1),days=new Date(cy,cm+1,0).getDate(),off=(f.getDay()+6)%7,by={};S.forEach(s=>(by[kd(new Date(s.startTime))]??=[]).push(s));
let h="Mon Tue Wed Thu Fri Sat Sun".split(" ").map(d=>`<small>${d}</small>`).join("")+"<i></i>".repeat(off);
for(let d=1;d<=days;d++){const k=`${cy}-${cm}-${d}`;h+=`<button class="d ${k==kd(new Date())?"t":""} ${k==sel?"s":""}" data-k="${k}">${d}<span>${(by[k]||[]).slice(0,3).map(s=>`<em style="background:${{Live:"var(--g)",Upcoming:"var(--ac)",Finished:"var(--mu)"}[stt(s)]}"></em>`).join("")}</span></button>`}
$("#cg").innerHTML=h;$("#mt").textContent=f.toLocaleString("en",{month:"long",year:"numeric"});const[y,m,d]=sel.split("-").map(Number);$("#dh").textContent=new Date(y,m,d).toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"});$("#dl").innerHTML=(by[sel]||[]).map(row).join("")||'<p class="em">No exams on this day.</p>'}
const mv=n=>{cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}cal()};$("#pv").onclick=()=>mv(-1);$("#nt").onclick=()=>mv(1);$("#cg").onclick=e=>{const b=e.target.closest(".d");if(b){sel=b.dataset.k;cal()}};
setInterval(()=>{const n=Date.now(),nx=S.find(s=>stt(s)!="Finished"),b=$("#nx");if(nx){const lv=stt(nx)=="Live";b.classList.add("show");b.innerHTML=`<span>⏱</span><span><b>${lv?"Exam live now":"Next exam using your package"}:</b> ${esc(nx.title)} <span class="mono" style="color:var(--ac)">${lv?"ends in "+hms(nx.endTime-n):"starts in "+hms(nx.startTime-n)}</span></span>`}else b.classList.remove("show")},1000);
await load();paint();ready();
</script></body></html>
