<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBT Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
:root{--n:#0f172a;--s:#475569;--a:#6366f1;--bg:#f1f5f9;--b:#e2e8f0;--g:#16a34a;--y:#eab308;--r:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--n)}
button{background:var(--a);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;transition:.15s}button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:default}
button.o{background:#fff;color:var(--a);border:1px solid var(--a)}button.x{background:var(--r)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--b);border-radius:8px;font:inherit;margin:4px 0;background:#fff}
.top{display:flex;gap:14px;align-items:center;background:var(--n);color:#fff;padding:10px 20px;flex-wrap:wrap}.top b span{color:#a5b4fc}.top nav{flex:1;display:flex;gap:4px;flex-wrap:wrap}.top a{padding:6px 12px;border-radius:8px;cursor:pointer;color:#cbd5e1}.top a.on,.top a:hover{background:var(--a);color:#fff}
main{max-width:1100px;margin:20px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.hero{background:linear-gradient(135deg,var(--n),#312e81);color:#fff;padding:96px 20px;text-align:center}.hero h1{font-size:2.6rem;margin:0 0 12px}.hero p{max-width:560px;margin:0 auto 24px;color:#cbd5e1}
.lg{max-width:400px;margin:60px auto}.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--b)}
.q{display:grid;grid-template-columns:1fr 240px;gap:16px}@media(max-width:760px){.q{grid-template-columns:1fr}}
.ex{user-select:none;-webkit-user-select:none}.ex input[type=text]{user-select:text;-webkit-user-select:text}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.nums button{background:#cbd5e1;color:var(--n);padding:8px 0}.nums .ok{background:var(--g);color:#fff}.nums .mk{background:var(--y)}.nums .cur{outline:3px solid var(--a)}
.opt{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--b);border-radius:8px;margin:6px 0;cursor:pointer}.opt input{width:auto;margin:0}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.94);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;padding:20px}.ov h2{font-size:1.8rem}
</style></head><body><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,createUserWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,query,where,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ===== 1. PASTE YOUR FIREBASE CONFIG HERE =====
const firebaseConfig = {
  apiKey: "AIzaSyDHGqit0SiTiIL5Z2Xv28oWueH6sHdTlSw",
  authDomain: "cbtnow-myown.firebaseapp.com",
  projectId: "cbtnow-myown",
  storageBucket: "cbtnow-myown.firebasestorage.app",
  messagingSenderId: "550333230262",
  appId: "1:550333230262:web:f6aca07372fbe950f64a17",
  measurementId: "G-S4SWSPYCD1"
};// ==============================================
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app),auth2=getAuth(initializeApp(CFG,"s2"));
const A=window.A={},$=window.$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const math=()=>window.renderMathInElement&&renderMathInElement(document.body,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});
const put=(h,el="#app")=>{$(el).innerHTML=h;math()};
const nid=c=>doc(collection(db,c));
const list=async(c,...w)=>(await getDocs(w.length?query(collection(db,c),...w):collection(db,c))).docs.map(d=>({id:d.id,...d.data()}));
const CH="abcdefghjkmnpqrstuvwxyzACDEFGHJKLMNPQRSTUVWXYZ23456789",gen=A.gen=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>CH[b%CH.length]).join("")+"!";
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1e3));return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,"0")).join(":")};
const dt=t=>t?new Date(t).toLocaleString():"-";
const opts=(a,v="id",l="name",sel=[])=>a.map(x=>`<option value="${x[v]}" ${sel.includes(x[v])?"selected":""}>${esc(x[l]||x.email)}</option>`).join("");
const R={OPERATOR:"Operator",MANAGEMENT:"Management",PROBLEM_SETTER:"Problem Setter",PROCTOR:"Proctor",PARTICIPANT:"Participant"};
const TABS={OPERATOR:[["h","Management Accounts"]],MANAGEMENT:[["h","Overview"],["a","Accounts & Classes"],["q","Questions"],["e","Exams"]],PROBLEM_SETTER:[["h","Overview"],["q","Questions"]],PROCTOR:[["h","Overview"],["e","Exams"]],PARTICIPANT:[["h","My Exams"]]};
let me,tab,cur,X,mon,ns,after,tm,LU=[],subs=[],SS=[],PK={},unsubs=[],onLogin=false;
const stop=()=>{unsubs.forEach(f=>f());unsubs=[]};
const stat=(l,n)=>`<div class=card><h2 style="margin:0">${n}</h2>${l}</div>`;

// ===== Landing & auth =====
const landing=()=>put(`<section class=hero><h1>Computer-based testing with integrity</h1><p>Live proctoring, auto-grading, dynamic question types and class management in one platform.</p><button onclick="A.login()">Sign in</button></section><main><div class=grid>${[["Live proctoring","Real-time participant status and violation logs."],["Auto-grading","Instant scores and one-click CSV export."],["Dynamic questions","Multiple choice, complex choice and short answer with LaTeX."],["Class management","Group participants and assign them to sessions in one step."]].map(([t,d])=>`<div class=card><h3>${t}</h3><p>${d}</p></div>`).join("")}</div></main>`);
A.login=()=>{onLogin=true;put(`<form class="card lg" onsubmit="A.signin(event)"><h2>Sign in</h2><input name=email type=email placeholder=Email required><input name=pw type=password placeholder=Password required><button style="width:100%">Sign in</button><p><a href=# onclick="A.reset();return false">Forgot password?</a></p><p id=er style="color:var(--r)"></p></form>`)};
A.signin=async e=>{e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,f.get("email"),f.get("pw"))}catch(x){$("#er").textContent="Sign-in failed: "+x.code}};
A.reset=()=>{const em=prompt("Your email");em&&sendPasswordResetEmail(auth,em).then(()=>alert("Reset email sent."),x=>alert(x.code))};
onAuthStateChanged(auth,async u=>{stop();if(!u){me=null;return onLogin?A.login():landing()}
const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()){alert("No profile found for this account. Contact your administrator.");return signOut(auth)}
me={uid:u.uid,...s.data()};tab=TABS[me.role][0][0];cur=mon=ns=null;dash()});
A.out=()=>{stop();signOut(auth)};A.home=()=>dash();
A.tab=async k=>{if(cur)await A.save();cur=mon=ns=null;tab=k;dash()};
async function dash(){stop();after=null;const body=await view();
put(`<header class=top><b>CBT<span>Pro</span></b><nav>${TABS[me.role].map(([k,l])=>`<a class="${tab==k?"on":""}" onclick="A.tab('${k}')">${l}</a>`).join("")}</nav><small>${esc(me.name)} · ${R[me.role]}</small><button class=o onclick="A.out()">Sign out</button></header><main>${body}</main>`);after&&after()}
const view=()=>me.role=="OPERATOR"?opView():tab=="h"?home():tab=="a"?accView():tab=="q"?qView():exView();
A.rm=async(c,id)=>{if(confirm("Delete this item? (Deleting a user removes the profile only; remove the login in Firebase Console > Authentication.)")){await deleteDoc(doc(db,c,id));dash()}};

// ===== Accounts =====
async function mkUser(role,f){const c=await createUserWithEmailAndPassword(auth2,f.email,f.password);await signOut(auth2);
await setDoc(doc(db,"users",c.user.uid),{uid:c.user.uid,email:f.email,role,name:f.name,desc:f.desc||"",logoUrl:f.logo||"",classIds:[],createdBy:me.uid,createdAt:Date.now()})}
A.mk=async(e,role)=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));role=role||f.role;try{await mkUser(role,f);navigator.clipboard?.writeText(`${f.email} / ${f.password}`);alert(`Account created. Credentials copied:\n${f.email} / ${f.password}`);dash()}catch(x){alert(x.code||x.message)}};
A.bulk=async()=>{let n=0;for(const l of $("#csv").value.split("\n")){const[role,name,email,password]=l.split(",").map(s=>s.trim());if(!email||!["PROBLEM_SETTER","PROCTOR","PARTICIPANT"].includes(role.toUpperCase()))continue;try{await mkUser(role.toUpperCase(),{name,email,password});n++}catch(x){alert(email+": "+x.code)}}alert(n+" accounts created.");dash()};
A.ed=async id=>{const n=prompt("Organization name?");if(n===null)return;const d=prompt("Work description?");await updateDoc(doc(db,"users",id),{name:n,desc:d||""});dash()};
async function opView(){const u=await list("users",where("role","==","MANAGEMENT"));
return`<div class=card><h3>Create management account</h3><form onsubmit="A.mk(event,'MANAGEMENT')"><div class=grid><input name=name placeholder="Organization name" required><input name=logo placeholder="Logo URL"><input name=desc placeholder="Work description"><input name=email type=email placeholder=Email required><input name=password id=pwf placeholder="Password (min 6)" required></div><div class=row><button type=button class=o onclick="$('#pwf').value=A.gen()">Generate password</button><button>Create</button></div></form></div><div class=card><h3>Management accounts (${u.length})</h3><table>${u.map(x=>`<tr><td>${x.logoUrl?`<img src="${esc(x.logoUrl)}" height=24> `:""}${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.desc)}</td><td><button class=o onclick="A.ed('${x.uid}')">Edit</button> <button class=x onclick="A.rm('users','${x.uid}')">Delete</button></td></tr>`).join("")}</table></div>`}
async function accView(){const w=where("createdBy","==",me.uid),[u,c]=await Promise.all([list("users",w),list("classes",w)]),ps=u.filter(x=>x.role=="PARTICIPANT");
return`<div class=card><h3>Create account</h3><form onsubmit="A.mk(event)"><div class=grid><select name=role><option value=PROBLEM_SETTER>Problem Setter<option value=PROCTOR>Proctor<option value=PARTICIPANT>Participant</select><input name=name placeholder=Name required><input name=email type=email placeholder=Email required><input name=password id=pwf placeholder=Password required></div><div class=row><button type=button class=o onclick="$('#pwf').value=A.gen()">Generate password</button><button>Create</button></div></form><details><summary>Bulk import CSV (role,name,email,password)</summary><textarea id=csv rows=4 placeholder="PARTICIPANT,Ann,ann@mail.com,Pass1234!"></textarea><button onclick="A.bulk()">Import</button></details></div>
<div class=card><h3>Classes</h3><form onsubmit="A.cls(event)"><div class=grid><input name=name placeholder="Class name" required><input name=description placeholder=Description></div><select name=students multiple size=5>${opts(ps,"uid")}</select><button>Create class</button></form><table>${c.map(x=>`<tr><td>${esc(x.name)}</td><td>${(x.studentUids||[]).length} students</td><td><button class=x onclick="A.rm('classes','${x.id}')">Delete</button></td></tr>`).join("")}</table></div>
<div class=card><h3>Accounts (${u.length})</h3><table>${u.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td><span class=tag>${R[x.role]}</span></td><td><button class=x onclick="A.rm('users','${x.uid}')">Delete</button></td></tr>`).join("")}</table></div>`}
A.cls=async e=>{e.preventDefault();const f=new FormData(e.target),r=nid("classes");await setDoc(r,{id:r.id,name:f.get("name"),description:f.get("description"),studentUids:f.getAll("students"),createdBy:me.uid});dash()};
async function home(){const r=me.role;if(r=="PARTICIPANT")return pView();const w=where("createdBy","==",me.uid);
const[pk,ss]=await Promise.all(r=="MANAGEMENT"?[list("question_packages",w),list("exam_sessions",w)]:r=="PROCTOR"?[[],list("exam_sessions",where("assignedProctorUids","array-contains",me.uid))]:[list("question_packages",where("assignedSetterUids","array-contains",me.uid)),[]]);
const now=Date.now();let x="";if(r=="MANAGEMENT"){const u=await list("users",w);x=["PROBLEM_SETTER","PROCTOR","PARTICIPANT"].map(k=>stat(R[k]+"s",u.filter(y=>y.role==k).length)).join("")}
return`<div class=grid>${r=="PROCTOR"?"":stat("Question packages",pk.length)}${r=="PROBLEM_SETTER"?"":stat("Exam sessions",ss.length)+stat("Active now",ss.filter(s=>s.startTime<=now&&now<=s.endTime).length)}${x}</div>`}

// ===== Question packages =====
const TY=[["mcq","Multiple Choice"],["complex","Complex Multiple Choice"],["short","Short Answer"]];
const qHTML=(q,i)=>`<div class=card><div class=row><b>#${i+1}</b><select style="width:auto" onchange="A.q(${i},'type',this.value)">${TY.map(([v,l])=>`<option value=${v} ${q.type==v?"selected":""}>${l}</option>`).join("")}</select><label>Score <input type=number style="width:70px" value=${q.score} oninput="A.q(${i},'score',+this.value)"></label><button class=x onclick="A.dq(${i})">Delete</button></div><textarea rows=3 placeholder="Question (HTML allowed, e.g. &lt;img src=...&gt;; LaTeX: $x^2$)" oninput="A.q(${i},'text',this.value)">${esc(q.text)}</textarea>${q.type!="short"?`<textarea rows=4 placeholder="Options, one per line (3, 4, 5 or more)" oninput="A.q(${i},'options',this.value.split('\\n'))">${esc(q.options.join("\n"))}</textarea>`:""}<input value="${esc(q.correct)}" placeholder="${q.type=="short"?"Correct answer (exact match, case-insensitive)":q.type=="mcq"?"Correct option number, e.g. 2":"Correct option numbers, e.g. 1,3"}" oninput="A.q(${i},'correct',this.value)"></div>`;
async function qView(){if(cur)return editor();const m=me.role=="MANAGEMENT",p=await list("question_packages",m?where("createdBy","==",me.uid):where("assignedSetterUids","array-contains",me.uid));p.forEach(x=>PK[x.id]=x);
return`${m?`<button onclick="A.newpk()">New package</button>`:""}${p.map(x=>`<div class="card row"><b>${esc(x.title)}</b><span class=tag>${x.status}</span><span>${(x.questions||[]).length} questions · ${x.durationMinutes} min</span><button class=o onclick="A.open('${x.id}')">Open</button>${m?`<button class=x onclick="A.rm('question_packages','${x.id}')">Delete</button>`:""}</div>`).join("")||"<p>No packages yet.</p>"}`}
async function editor(){const m=me.role=="MANAGEMENT",st=m?await list("users",where("role","==","PROBLEM_SETTER"),where("createdBy","==",me.uid)):[],d=m?"":"disabled";
return`<div class=card><div class=row><button class=o onclick="A.back()">Back</button><span id=st class=tag>Saved</span><button onclick="A.save()">Save</button></div><div class=grid><label>Title<input value="${esc(cur.title)}" ${d} oninput="A.p('title',this.value)"></label><label>Default duration (min)<input type=number value=${cur.durationMinutes} ${d} oninput="A.p('durationMinutes',+this.value)"></label><label>Status<select ${d} onchange="A.p('status',this.value)"><option ${cur.status=="draft"?"selected":""}>draft<option ${cur.status=="published"?"selected":""}>published</select></label>${m?`<label>Problem setters (include yourself if needed)<select multiple onchange="A.p('assignedSetterUids',[...this.selectedOptions].map(o=>o.value))">${opts(st,"uid","name",cur.assignedSetterUids)}</select></label>`:""}</div></div>${cur.questions.map(qHTML).join("")}<button onclick="A.addq()">Add question</button>`}
const dirty=()=>{clearTimeout(tm);$("#st")&&($("#st").textContent="Saving…");tm=setTimeout(A.save,2500)};
A.newpk=()=>{cur={id:nid("question_packages").id,title:"Untitled package",durationMinutes:60,assignedSetterUids:[],questions:[],status:"draft",createdBy:me.uid};dash()};
A.open=id=>{cur=structuredClone(PK[id]);cur.questions=cur.questions||[];dash()};
A.p=(k,v)=>{cur[k]=v;dirty()};A.q=(i,k,v)=>{cur.questions[i][k]=v;if(k=="type")dash();else dirty()};
A.addq=()=>{cur.questions.push({type:"mcq",text:"",options:["","","",""],correct:"1",score:1});dash()};A.dq=i=>{cur.questions.splice(i,1);dash()};
A.save=async()=>{if(!cur)return;clearTimeout(tm);try{me.role=="MANAGEMENT"?await setDoc(doc(db,"question_packages",cur.id),cur):await updateDoc(doc(db,"question_packages",cur.id),{questions:cur.questions});$("#st")&&($("#st").textContent="Saved")}catch(x){alert("Save failed: "+x.code)}};
A.back=async()=>{await A.save();cur=null;dash()};

// ===== Events, sessions, live monitor =====
const sesList=s=>`<table>${s.map(x=>`<tr><td>${esc(x.title)}</td><td>${dt(x.startTime)} to ${dt(x.endTime)}</td><td>Token: <b>${esc(x.token)}</b></td><td>${(x.assignedParticipantUids||[]).length} participants</td><td><button onclick="A.mon('${x.id}')">Live / results</button>${me.role=="MANAGEMENT"?` <button class=x onclick="A.rm('exam_sessions','${x.id}')">Delete</button>`:""}</td></tr>`).join("")||"<tr><td>No sessions.</td></tr>"}</table>`;
async function exView(){if(mon)return live();
if(me.role!="MANAGEMENT")return`<div class=card>${sesList(await list("exam_sessions",where("assignedProctorUids","array-contains",me.uid)))}</div>`;
const w=where("createdBy","==",me.uid),[ev,ss]=await Promise.all([list("events",w),list("exam_sessions",w)]),form=ns?await sesForm():"";
return`<div class=card><h3>New event</h3><form onsubmit="A.ev(event)"><div class=grid><input name=title placeholder="Event title" required><input name=logoUrl placeholder="Logo URL"><input name=description placeholder=Description></div><button>Create event</button></form></div>${ev.map(e=>`<div class=card><div class=row>${e.logoUrl?`<img src="${esc(e.logoUrl)}" height=28>`:""}<h3 style="margin:0">${esc(e.title)}</h3><button class=o onclick="A.ns('${e.id}')">Add session</button><button class=x onclick="A.rm('events','${e.id}')">Delete</button></div><p>${esc(e.description)}</p>${ns==e.id?form:""}${sesList(ss.filter(s=>s.eventId==e.id))}</div>`).join("")}`}
async function sesForm(){const w=where("createdBy","==",me.uid),[pk,u,c]=await Promise.all([list("question_packages",w),list("users",w),list("classes",w)]),ck=n=>`<label><input type=checkbox name=${n} checked style="width:auto"> `;
return`<form class=card onsubmit="A.ss(event)"><div class=grid><input name=title placeholder="Session name" required><input name=description placeholder=Description><label>Question package<select name=pk>${opts(pk,"id","title")}</select></label><label>Duration (min)<input name=dur type=number value=60></label><label>Start<input name=st type=datetime-local required></label><label>Hard end<input name=en type=datetime-local required></label><label>Token<input name=token placeholder="Blank = random"></label></div><div class=grid><label>Proctors<select name=pr multiple>${opts(u.filter(x=>x.role=="PROCTOR"),"uid")}</select></label><label>Classes<select name=cl multiple>${opts(c)}</select></label><label>Individual participants<select name=pa multiple>${opts(u.filter(x=>x.role=="PARTICIPANT"),"uid")}</select></label></div><div class=row><b>Integrity rules:</b>${ck("r1")}Tab switch</label>${ck("r2")}Copy / paste</label>${ck("r3")}Screenshot</label></div><button>Create session</button></form>`}
A.ns=id=>{ns=id;dash()};
A.ev=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),r=nid("events");await setDoc(r,{id:r.id,...f,sessions:[],createdBy:me.uid});dash()};
A.ss=async e=>{e.preventDefault();const f=new FormData(e.target),cl=f.getAll("cl"),cs=await list("classes",where("createdBy","==",me.uid)),r=nid("exam_sessions"),ids=[...new Set([...f.getAll("pa"),...cs.filter(c=>cl.includes(c.id)).flatMap(c=>c.studentUids||[])])];
await setDoc(r,{id:r.id,eventId:ns,title:f.get("title"),description:f.get("description"),packageId:f.get("pk"),durationMinutes:+f.get("dur"),startTime:new Date(f.get("st")).getTime(),endTime:new Date(f.get("en")).getTime(),token:f.get("token")||gen().slice(0,6).toUpperCase(),assignedProctorUids:f.getAll("pr"),assignedParticipantUids:ids,classIds:cl,violationRules:{tab:!!f.get("r1"),copy:!!f.get("r2"),shot:!!f.get("r3")},createdBy:me.uid});
await updateDoc(doc(db,"events",ns),{sessions:arrayUnion(r.id)});ns=null;dash()};
A.mon=async id=>{mon=(await getDoc(doc(db,"exam_sessions",id))).data();dash()};A.leave=()=>{mon=null;dash()};
const status=x=>!x?"Not Started":x.isBlocked?"Blocked":x.status=="submitted"?"Submitted":"In Progress";
async function live(){const s=mon;LU=(await Promise.all((s.assignedParticipantUids||[]).map(i=>getDoc(doc(db,"users",i))))).map(d=>d.data()).filter(Boolean);
after=()=>unsubs.push(onSnapshot(query(collection(db,"exam_submissions"),where("sessionId","==",s.id)),q=>{subs=q.docs.map(d=>({id:d.id,...d.data()}));drawLive()}));
return`<div class=card><div class=row><button class=o onclick="A.leave()">Back</button><h3 style="margin:0">${esc(s.title)}</h3><button class=o onclick="A.csvx()">Export CSV</button></div><div id=lv></div><div id=dt></div></div>`}
function drawLive(){const rows=LU.map(u=>({u,x:subs.find(s=>s.participantUid==u.uid)}));
put(`<table><tr><th>Participant<th>Status<th>Score<th>Violations<th>Notes<th></tr>${rows.map(({u,x})=>`<tr><td>${esc(u.name)}<br><small>${esc(u.email)}</small><td>${status(x)}<td>${x?.status=="submitted"?`${x.score} (${x.correctCount} right / ${x.wrongCount} wrong)`:"-"}<td>${(x?.violationLogs||[]).length}<td>${esc(x?.notes||"")}<td>${x?`<button class=o onclick="A.blk('${x.id}',${!x.isBlocked})">${x.isBlocked?"Unblock":"Block"}</button> <button class=o onclick="A.note('${x.id}')">Note</button> ${x.status!="submitted"?`<button class=x onclick="A.force('${x.id}')">Force submit</button> `:""}<button class=o onclick="A.det('${x.id}')">Detail</button>`:""}</tr>`).join("")}</table><h4>Violation log</h4>${subs.flatMap(x=>(x.violationLogs||[]).map(v=>({...v,n:x.participantName}))).sort((a,b)=>b.at-a.at).map(v=>`<div>${dt(v.at)}: ${esc(v.n)}, ${esc(v.type)}</div>`).join("")||"<small>No violations.</small>"}`,"#lv")}
const sd=(id,d)=>updateDoc(doc(db,"exam_submissions",id),d);
A.blk=(id,b)=>sd(id,{isBlocked:b});A.force=id=>confirm("Force-submit this participant?")&&sd(id,{forceSubmit:true});A.note=id=>{const n=prompt("Note");n!==null&&sd(id,{notes:n})};
A.det=async id=>{const x=subs.find(s=>s.id==id),p=(await getDoc(doc(db,"question_packages",mon.packageId))).data();put(`<h4>${esc(x.participantName)}: answers</h4>${p.questions.map((q,i)=>`<div class=card><b>${i+1}.</b> ${q.text}<br>Answer: <b>${esc(JSON.stringify(x.answers?.[i]??"-"))}</b> · Key: <b>${esc(q.correct)}</b></div>`).join("")}`,"#dt")};
A.csvx=()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,rows=[["Name","Email","Status","Score","Correct","Wrong","Time spent (min)","Started","Finished","Violations","Blocked"],...LU.map(u=>{const x=subs.find(s=>s.participantUid==u.uid);return[u.name,u.email,status(x),x?.score??"",x?.correctCount??"",x?.wrongCount??"",x?.timeSpent?(x.timeSpent/6e4).toFixed(1):"",dt(x?.startedAt),dt(x?.finishedAt),(x?.violationLogs||[]).length,!!x?.isBlocked]})],a=document.createElement("a");
a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}));a.download=mon.title+".csv";a.click()};

// ===== Participant =====
async function pView(){const[ss,sb]=await Promise.all([list("exam_sessions",where("assignedParticipantUids","array-contains",me.uid)),list("exam_submissions",where("participantUid","==",me.uid))]),now=Date.now();SS=ss;
return ss.map(s=>{const x=sb.find(b=>b.sessionId==s.id),done=x?.status=="submitted",st=done?"Completed":now>s.endTime?"Missed":now<s.startTime?"Upcoming":"Active";
return`<div class="card row"><b>${esc(s.title)}</b><span class=tag>${st}</span><span>${dt(s.startTime)} to ${dt(s.endTime)} · ${s.durationMinutes} min</span>${done?`<b>Score: ${x.score}</b>`:st=="Missed"?"":`<button onclick="A.pre('${s.id}')">${x?"Resume":"Open"}</button>`}</div>`}).join("")||"<p>No exams assigned yet.</p>"}
A.pre=id=>{const s=SS.find(x=>x.id==id);put(`<main><div class="card lg"><h2>${esc(s.title)}</h2><p>${esc(s.description||"")}</p><h1 id=cd style="text-align:center"></h1><input id=tk placeholder="Exam token"><label><input type=checkbox id=ag style="width:auto"> I agree to uphold exam integrity. Violations are logged and lock the exam for 1 minute.</label><div class=row><button class=o onclick="A.home()">Cancel</button><button onclick="A.start('${id}')">Start exam</button></div></div></main>`);
const t=setInterval(()=>{if(!$("#cd"))return clearInterval(t);const l=s.startTime-Date.now();$("#cd").textContent=l>0?"Starts in "+fmt(l):"Ready"},500)};
A.start=async id=>{const s=SS.find(x=>x.id==id),now=Date.now();
if(now<s.startTime||now>s.endTime)return alert("The exam is outside its time window.");
if($("#tk").value.trim().toUpperCase()!=String(s.token).toUpperCase())return alert("Invalid token.");
if(!$("#ag").checked)return alert("Accept the integrity agreement first.");
const ref=doc(db,"exam_submissions",`${id}_${me.uid}`);let sn=await getDoc(ref);
if(!sn.exists()){await setDoc(ref,{id:ref.id,sessionId:id,participantUid:me.uid,participantName:me.name,answers:{},marked:{},status:"in_progress",startedAt:now,violationLogs:[],isBlocked:false,forceSubmit:false,notes:""});sn=await getDoc(ref)}
const x=sn.data();if(x.status=="submitted")return A.home();
const p=(await getDoc(doc(db,"question_packages",s.packageId))).data();
X={s,p,ref,i:0,ans:x.answers||{},mk:x.marked||{},start:x.startedAt,dl:Math.min(x.startedAt+s.durationMinutes*6e4,s.endTime),lv:0,lockEnd:0,done:false};exam()};

// ===== Exam workspace + anti-cheat =====
const pv=c=>e=>{e.preventDefault();viol(c,e.type=="contextmenu"?"Right-click attempt":"Clipboard: "+e.type)};
const H={visibilitychange:()=>document.hidden&&viol("tab","Tab switch / app hidden"),blur:()=>viol("tab","Window lost focus"),copy:pv("copy"),cut:pv("copy"),paste:pv("copy"),contextmenu:pv("copy"),
keyup:e=>{if(e.key=="PrintScreen"){navigator.clipboard?.writeText("").catch(()=>{});viol("shot","PrintScreen pressed")}},
keydown:e=>{const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;if(m&&e.shiftKey&&k=="s"){e.preventDefault();return viol("shot","Screenshot shortcut")}if(m&&["c","v","x","p","s","u"].includes(k)){e.preventDefault();viol("copy","Blocked shortcut: "+k.toUpperCase())}}};
function viol(cat,t){if(!X||X.done||Date.now()-X.lv<1500)return;X.lv=Date.now();if(!X.s.violationRules?.[cat])return;
updateDoc(X.ref,{violationLogs:arrayUnion({type:t,at:Date.now()})}).catch(()=>{});if(!X.lockEnd)X.lockEnd=Date.now()+6e4;tick()}
function exam(){document.body.classList.add("ex");Object.entries(H).forEach(([k,f])=>addEventListener(k,f,true));
X.sub=onSnapshot(X.ref,d=>{const x=d.data();$("#bk")&&($("#bk").style.display=x.isBlocked?"flex":"none");x.forceSubmit&&finish()});X.iv=setInterval(tick,1000);draw()}
const ok=v=>v!=null&&v!==""&&!(Array.isArray(v)&&!v.length);
function draw(){const i=X.i,q=X.p.questions[i],a=X.ans[i],n=X.p.questions.length,on=j=>q.type=="mcq"?a==j+1:(a||[]).includes(j+1);
put(`<header class=top><b>${esc(X.s.title)}</b><span style="flex:1"></span><b id=tm style="font-size:1.3rem"></b><button class=x onclick="A.fin()">Submit exam</button></header><main class=q><div class=card><small>Question ${i+1} of ${n} · ${q.score} pt</small><div style="margin:10px 0">${q.text}</div>${q.type=="short"?`<input type=text autocomplete=off value="${esc(a??"")}" oninput="A.a(${i},this.value)" placeholder="Your answer">`:q.options.map((o,j)=>`<label class=opt><input type=${q.type=="mcq"?"radio":"checkbox"} name=o ${on(j)?"checked":""} onchange="A.${q.type=="mcq"?"a":"c"}(${i},${j+1},this.checked)"><span>${o}</span></label>`).join("")}<div class=row style="margin-top:14px"><button class=o onclick="A.go(${i-1})" ${i?"":"disabled"}>Previous</button><button class=o style="border-color:var(--y);color:#a16207" onclick="A.mark()">${X.mk[i]?"Unmark review":"Mark for review"}</button><button onclick="A.go(${i+1})" ${i<n-1?"":"disabled"}>Next</button></div></div><div class=card><b>Questions</b><div class=nums id=nums></div><small>Green: answered · Yellow: review · Gray: unanswered</small></div></main>
<div class=ov id=lk><h2>Violation Detected! Examination paused for 1 minute.</h2><h1 id=lc></h1></div><div class=ov id=bk><h2>You have been blocked by the proctor.</h2><p>Wait for the proctor to unblock you.</p></div><div class=ov id=cf><h2>Submit exam?</h2><p id=cfm></p><div class=row><button class=o onclick="$('#cf').style.display='none'">Keep working</button><button class=x onclick="A.finish()">Submit now</button></div></div>`);grid();tick()}
function grid(){$("#nums").innerHTML=X.p.questions.map((_,k)=>`<button class="${X.mk[k]?"mk":ok(X.ans[k])?"ok":""} ${k==X.i?"cur":""}" onclick="A.go(${k})">${k+1}</button>`).join("")}
const saveA=()=>{clearTimeout(X.t);X.t=setTimeout(()=>updateDoc(X.ref,{answers:X.ans,marked:X.mk}).catch(()=>{}),800)};
A.a=(i,v)=>{X.ans[i]=v;saveA();grid()};
A.c=(i,v,ck)=>{const s=new Set(X.ans[i]||[]);ck?s.add(v):s.delete(v);X.ans[i]=[...s].sort((a,b)=>a-b);saveA();grid()};
A.go=k=>{X.i=k;draw()};A.mark=()=>{X.mk[X.i]=!X.mk[X.i];saveA();draw()};
A.fin=()=>{const u=X.p.questions.filter((_,k)=>!ok(X.ans[k])).length;$("#cfm").textContent=u?`${u} question(s) are unanswered.`:"All questions are answered.";$("#cf").style.display="flex"};
function tick(){if(!X||X.done)return;const l=X.dl-Date.now();if(l<=0)return finish();$("#tm")&&($("#tm").textContent=fmt(l));const lk=$("#lk");
if(X.lockEnd&&lk){const r=Math.ceil((X.lockEnd-Date.now())/1e3);if(r<=0){X.lockEnd=0;lk.style.display="none"}else{lk.style.display="flex";$("#lc").textContent=r}}}
function grade(qs,a){let score=0,correct=0,wrong=0;qs.forEach((q,i)=>{const v=a[i];if(!ok(v))return;const key=String(q.correct).trim().toLowerCase(),k=q.type=="complex"?key.split(",").map(Number).sort((x,y)=>x-y).join(","):key,g=q.type=="short"?String(v).trim().toLowerCase():q.type=="mcq"?String(v):[...v].sort((x,y)=>x-y).join(",");if(g==k){score+=+q.score||0;correct++}else wrong++});return{score,correct,wrong}}
async function finish(){if(!X||X.done)return;X.done=true;clearInterval(X.iv);X.sub();Object.entries(H).forEach(([k,f])=>removeEventListener(k,f,true));document.body.classList.remove("ex");
const r=grade(X.p.questions,X.ans),now=Date.now();
try{await updateDoc(X.ref,{answers:X.ans,marked:X.mk,status:"submitted",score:r.score,correctCount:r.correct,wrongCount:r.wrong,timeSpent:now-X.start,finishedAt:now})}catch(x){alert("Submit failed: "+x.code)}
X=null;alert("Exam submitted.");dash()}
A.finish=finish;
</script></body></html>
