<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · CBTNow</title><meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><rect width=%27100%27 height=%27100%27 rx=%2724%27 fill=%27%236366f1%27/><path d=%27M28 52l16 16 30-34%27 stroke=%27white%27 stroke-width=%2712%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#060918;--bg2:#0b1030;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);--tx:#e8ebff;--mu:#8f98c9;--a:#6366f1;--v:#a855f7;--c:#22d3ee;--g:#34d399;--y:#fbbf24;--r:#f87171;--ac:#6366f1}
*{box-sizing:border-box;margin:0}body{font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
h1,h2,h3,.logo,.big{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}.mono{font-family:"JetBrains Mono",monospace}a{color:inherit;text-decoration:none}
.bgfx{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 10% -5%,color-mix(in srgb,var(--ac) 35%,transparent),transparent 60%),radial-gradient(700px 500px at 95% 5%,rgba(168,85,247,.2),transparent 60%),var(--bg)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.25;mask-image:radial-gradient(ellipse at 50% 0,#000 10%,transparent 70%)}
.logo{font-weight:700;font-size:1.3rem;display:flex;align-items:center;gap:10px}.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--v));display:grid;place-items:center;box-shadow:0 0 22px rgba(99,102,241,.55)}.logo span{color:var(--c)}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(6,9,24,.55);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:22px}
.nv{display:flex;flex-direction:column;gap:4px}.nv a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mu);cursor:pointer;transition:.2s}
.nv a:hover{background:var(--card);color:#fff}.nv a.on{background:color-mix(in srgb,var(--ac) 22%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.me{margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card)}.me b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me small{color:var(--mu)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);background:color-mix(in srgb,var(--ac) 14%,transparent);margin:6px 0 10px}
.out{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);font:600 .88rem Inter;cursor:pointer;transition:.2s}.out:hover{background:var(--card);border-color:var(--r);color:var(--r)}
main{padding:26px 30px 60px;max-width:1180px;width:100%}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.nv{flex-direction:row;overflow-x:auto;flex:1}.me{display:none}main{padding:18px 14px 50px}}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:30px 32px;border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 30%,transparent),rgba(255,255,255,.03) 60%);display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.hero::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-80px;top:-160px;background:radial-gradient(color-mix(in srgb,var(--ac) 55%,transparent),transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.hero h1{font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.1}.hero p{color:var(--mu);margin-top:6px}
.nx{margin-top:16px;display:inline-flex;gap:10px;align-items:center;padding:8px 14px;border-radius:12px;background:#00000040;border:1px solid var(--line);font-size:.9rem}
.clk{text-align:right;position:relative}.big{font-size:clamp(2.2rem,4.5vw,3.4rem);font-weight:700;line-height:1}.clk small{display:block;color:var(--mu);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:18px 0}
.st{padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden;transition:.25s;animation:rise .6s both}.st:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 60%,transparent)}
.st::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--ac),transparent)}.st b{font:700 2rem "Space Grotesk";display:block}.st span{color:var(--mu);font-size:.88rem}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.acts button{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 .9rem Inter;cursor:pointer;transition:.2s}
.acts button:first-child{background:linear-gradient(135deg,var(--a),var(--v));border:0;box-shadow:0 8px 26px rgba(99,102,241,.4)}.acts button:hover{transform:translateY(-2px);border-color:var(--ac)}
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.card{border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));padding:22px;margin-bottom:16px;backdrop-filter:blur(10px)}
.card h3{font-size:1.1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ch button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);cursor:pointer;font-size:1.1rem}.ch button:hover{background:var(--card)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cg small{text-align:center;color:var(--mu);font-size:.75rem;padding-bottom:4px}
.d{aspect-ratio:1;border-radius:12px;border:1px solid transparent;background:#ffffff08;color:var(--tx);font:500 .9rem Inter;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:.15s}
.d:hover{border-color:var(--ac)}.d.t{background:color-mix(in srgb,var(--ac) 30%,transparent);font-weight:700}.d.s{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.d span{display:flex;gap:3px;height:5px}.d em{width:5px;height:5px;border-radius:50%}
.it{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.it:last-child{border:0}.it b{display:block}.it small{color:var(--mu)}
.tag{padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--mu)}.tag.g{color:var(--g);border-color:rgba(52,211,153,.5)}.tag.y{color:var(--y);border-color:rgba(251,191,36,.5)}.tag.a{color:var(--ac);border-color:color-mix(in srgb,var(--ac) 60%,transparent)}
.em{color:var(--mu);padding:14px 0;font-size:.92rem}
.load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:30;transition:.4s}.load.h{opacity:0;pointer-events:none}.load i{width:34px;height:34px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--ac);animation:sp .8s linear infinite}@keyframes sp{to{rotate:360deg}}
.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;padding:12px 20px;border-radius:14px;background:rgba(11,16,48,.95);border:1px solid var(--line);opacity:0;transition:.35s;z-index:40}.toast.show{opacity:1;translate:-50% 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="bgfx"></div><div class="load" id="load"><i></i></div>
<div class="app"><aside><a class="logo" href="/dashboard"><div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l5 5 9-10"/></svg></div>CBT<span>Now</span></a>
<nav class="nv" id="nav"></nav><div class="me"><b id="mn"></b><small id="me2"></small><div><span class="chip" id="rl"></span></div><button class="out" id="so">Sign out</button></div></aside>
<main id="main"></main></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,query,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
// ===== PASTE YOUR FIREBASE CONFIG HERE (same as login page) =====
const CFG={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT.firebaseapp.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_APP_ID"};
// ================================================================
const auth=getAuth(initializeApp(CFG)),db=getFirestore(auth.app),$=s=>document.querySelector(s),W=window;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const list=async(c,...w)=>(await getDocs(query(collection(db,c),...w))).docs.map(d=>({id:d.id,...d.data()}));
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)};
// Role config: each role gets its own accent color, navigation and quick actions (same shared layout and theme)
const ROLES={
OPERATOR:{label:"Operator",ac:"#22d3ee",nav:[["🏠","Overview"],["🏢","Management accounts"],["⚙️","System settings"]],act:["Create management account","View all accounts"],focus:"Management accounts"},
MANAGEMENT:{label:"Management",ac:"#6366f1",nav:[["🏠","Overview"],["👥","Accounts & classes"],["📚","Question packages"],["🗓","Exams & sessions"]],act:["Schedule a session","New question package","Create account"],focus:"Coming up"},
PROBLEM_SETTER:{label:"Problem Setter",ac:"#a855f7",nav:[["🏠","Overview"],["📚","My packages"]],act:["Open my packages"],focus:"My question packages"},
PROCTOR:{label:"Proctor",ac:"#fbbf24",nav:[["🏠","Overview"],["🛡","My sessions"],["📡","Live monitor"]],act:["Open live monitor","View my sessions"],focus:"Coming up"},
PARTICIPANT:{label:"Participant",ac:"#34d399",nav:[["🏠","Overview"],["📝","My exams"],["🏆","My results"]],act:["Go to my exams"],focus:"Coming up"}};
let me,cfg,EV=[],FOCUS=[],STATS=[],now=new Date(),cy,cm,sel;
const kd=d=>`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`,hm=t=>new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
const stat=e=>now>=e.start&&now<=e.end?"Active":now>e.end?"Past":"Upcoming";
const greet=()=>{const h=new Date().getHours();return h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night"};
const toEv=(s,sub)=>({id:s.id,title:s.title,start:s.startTime,end:s.endTime,dur:s.durationMinutes,done:sub?.status=="submitted",score:sub?.score});
const evTag=e=>{const s=e.done?"Completed":stat(e);return`<span class="tag ${s=="Active"?"g":s=="Upcoming"?"a":e.done?"g":""}">${s}</span>`};
const evRow=e=>`<div class="it"><div><b>${esc(e.title)}</b><small>${new Date(e.start).toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})} · ${hm(e.start)}–${hm(e.end)} · ${e.dur} min</small></div>${evTag(e)}</div>`;
async function load(u){const r=me.role,w=where("createdBy","==",me.uid),n=Date.now();
if(r=="OPERATOR"){const m=await list("users",where("role","==","MANAGEMENT"));STATS=[["Management accounts",m.length]];
FOCUS=m.map(x=>`<div class="it"><div><b>${esc(x.name)}</b><small>${esc(x.email)}</small></div><span class="tag a">Management</span></div>`)}
if(r=="MANAGEMENT"){const[us,pk,ss]=await Promise.all([list("users",w),list("question_packages",w),list("exam_sessions",w)]);EV=ss.map(s=>toEv(s));
const c=k=>us.filter(x=>x.role==k).length;STATS=[["Participants",c("PARTICIPANT")],["Proctors",c("PROCTOR")],["Problem setters",c("PROBLEM_SETTER")],["Question packages",pk.length],["Exam sessions",ss.length],["Active now",ss.filter(s=>s.startTime<=n&&n<=s.endTime).length]]}
if(r=="PROBLEM_SETTER"){const pk=await list("question_packages",where("assignedSetterUids","array-contains",me.uid)),ids=pk.map(p=>p.id).slice(0,30);
if(ids.length)EV=(await list("exam_sessions",where("packageId","in",ids))).map(s=>toEv(s));
STATS=[["Assigned packages",pk.length],["Drafts",pk.filter(p=>p.status!="published").length],["Published",pk.filter(p=>p.status=="published").length],["Total questions",pk.reduce((a,p)=>a+(p.questions||[]).length,0)]];
FOCUS=pk.map(p=>`<div class="it"><div><b>${esc(p.title)}</b><small>${(p.questions||[]).length} questions · ${p.durationMinutes} min</small></div><span class="tag ${p.status=="published"?"g":"y"}">${esc(p.status)}</span></div>`)}
if(r=="PROCTOR"){EV=(await list("exam_sessions",where("assignedProctorUids","array-contains",me.uid))).map(s=>toEv(s));
STATS=[["Assigned sessions",EV.length],["Active now",EV.filter(e=>stat(e)=="Active").length],["Upcoming",EV.filter(e=>stat(e)=="Upcoming").length],["Finished",EV.filter(e=>stat(e)=="Past").length]]}
if(r=="PARTICIPANT"){const[ss,sb]=await Promise.all([list("exam_sessions",where("assignedParticipantUids","array-contains",me.uid)),list("exam_submissions",where("participantUid","==",me.uid))]);
EV=ss.map(s=>toEv(s,sb.find(b=>b.sessionId==s.id)));const dn=EV.filter(e=>e.done),av=dn.length?Math.round(dn.reduce((a,e)=>a+(e.score||0),0)/dn.length):"-";
STATS=[["Upcoming exams",EV.filter(e=>!e.done&&stat(e)=="Upcoming").length],["Active now",EV.filter(e=>!e.done&&stat(e)=="Active").length],["Completed",dn.length],["Average score",av]]}
EV.sort((a,b)=>a.start-b.start)}
function paint(){const R=ROLES[me.role],up=EV.filter(e=>!e.done&&e.end>=Date.now()),nx=up[0];
if(!FOCUS.length)FOCUS=up.slice(0,5).map(evRow);
$("#main").innerHTML=`<section class="hero"><div style="position:relative"><h1 id="gr"></h1><p>${R.label} dashboard${me.desc?" · "+esc(me.desc):""}</p>${nx?`<div class="nx"><span>⏱</span><span><b>Next:</b> ${esc(nx.title)} <span class="mono" id="cdn" style="color:var(--ac)"></span></span></div>`:""}</div><div class="clk"><div class="big mono" id="ck"></div><small id="dtx"></small></div></section>
<div class="stats">${STATS.map(([l,n],i)=>`<div class="st" style="animation-delay:${i*70}ms"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
<div class="acts">${R.act.map(a=>`<button onclick="soon()">${a}</button>`).join("")}</div>
<div class="cols"><div><div class="card"><div class="ch"><button onclick="mv(-1)" aria-label="Previous month">‹</button><b id="mt"></b><button onclick="mv(1)" aria-label="Next month">›</button></div><div class="cg" id="cg"></div>
<p class="em" style="padding-bottom:0;font-size:.8rem">${me.role=="OPERATOR"?"Operators have no assigned schedule.":"Your calendar fills automatically from the sessions assigned to your account."}</p></div></div>
<div><div class="card"><h3 id="dh"></h3><div id="dl"></div></div><div class="card"><h3>${R.focus}</h3>${FOCUS.length?FOCUS.slice(0,6).join(""):'<p class="em">Nothing here yet.</p>'}</div></div></div>`;
cal();clock()}
function cal(){const f=new Date(cy,cm,1),days=new Date(cy,cm+1,0).getDate(),off=(f.getDay()+6)%7,by={};EV.forEach(e=>(by[kd(new Date(e.start))]??=[]).push(e));
let h="Mon Tue Wed Thu Fri Sat Sun".split(" ").map(d=>`<small>${d}</small>`).join("")+"<i></i>".repeat(off);
for(let d=1;d<=days;d++){const k=`${cy}-${cm}-${d}`;h+=`<button class="d ${k==kd(new Date())?"t":""} ${k==sel?"s":""}" onclick="pk('${k}')">${d}<span>${(by[k]||[]).slice(0,3).map(e=>`<em style="background:${e.done?"#34d399":stat(e)=="Active"?"#34d399":stat(e)=="Past"?"#8f98c9":"var(--ac)"}"></em>`).join("")}</span></button>`}
$("#cg").innerHTML=h;$("#mt").textContent=f.toLocaleString("en",{month:"long",year:"numeric"});
const[y,m,d]=sel.split("-").map(Number),es=by[sel]||[];$("#dh").textContent=new Date(y,m,d).toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"});
$("#dl").innerHTML=es.map(evRow).join("")||'<p class="em">No sessions on this day.</p>'}
W.mv=n=>{cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}cal()};W.pk=k=>{sel=k;cal()};W.soon=()=>toast("This page is coming in the next step.");
function clock(){const t=new Date();now=t;$("#ck").textContent=t.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
$("#dtx").textContent=t.toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
$("#gr").textContent=`${greet()}, ${me.name.split(" ")[0]}`;
const nx=EV.find(e=>!e.done&&e.end>=Date.now());if(nx&&$("#cdn")){const l=nx.start-Date.now();$("#cdn").textContent=l>0?"starts in "+(l>864e5?Math.floor(l/864e5)+"d ":"")+new Date(l%864e5).toISOString().slice(11,19):"is live now"}}
onAuthStateChanged(auth,async u=>{if(!u)return location.replace("/login");
const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||!ROLES[s.data().role]){await signOut(auth);return location.replace("/login")}
me={uid:u.uid,...s.data()};cfg=ROLES[me.role];document.documentElement.style.setProperty("--ac",cfg.ac);
$("#mn").textContent=me.name;$("#me2").textContent=me.email;$("#rl").textContent=cfg.label;
$("#nav").innerHTML=cfg.nav.map(([i,l],k)=>`<a class="${k?"":"on"}" ${k?'onclick="soon()"':""}><span>${i}</span>${l}</a>`).join("");
const t=new Date();cy=t.getFullYear();cm=t.getMonth();sel=kd(t);
try{await load(u)}catch(e){STATS=[];toast("Some data couldn’t be loaded.")}
paint();setInterval(clock,1000);$("#load").classList.add("h")});
$("#so").onclick=()=>signOut(auth);
</script></body></html>
