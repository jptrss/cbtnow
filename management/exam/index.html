<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.28);color:var(--tx);font:inherit;outline:0}[data-theme=light] select{background:#fff}
select option{background:#0b1030;color:#e8ebff}[data-theme=light] select option{background:#fff;color:#0f172a}
input[type=checkbox],input[type=radio]{width:auto;padding:0;margin:0;accent-color:var(--ac)}
.btn.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 20%,transparent)}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.86rem;vertical-align:middle}th{color:var(--mu);font-weight:500;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}td small{display:block;color:var(--mu)}
.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--card);margin-bottom:14px}.hd h2{margin:0;font-size:1.4rem}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:700px){.f2{grid-template-columns:1fr}}

.ok{color:var(--g)}.bad{color:var(--r)}.wn{color:var(--y)}.tag.r{color:var(--r);border-color:rgba(248,113,113,.5)}.tag.y{color:var(--y);border-color:rgba(251,191,36,.5)}

<body><div class="bgfx"></div><div class="load" id="load"><i></i></div>
<div class="app"><aside id="side"></aside><main>
<section class="hero" id="hero"><div><h1>Exams &amp; sessions</h1><p>Plan events, schedule secure sessions, monitor live and publish results.</p></div><div class="clk"><div class="big mono" id="ck"></div><small id="dtx"></small></div></section>
<div class="stats" id="stats"></div>
<div id="v"></div>
</main></div><div class="mo" id="mo"></div><div class="toast" id="toast"></div>

<script type="module">
import{$,esc,toast,guard,shell,hero,ready,errMsg,db,NAV,logoData}from"/assets/core.js";
import{collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,query,where,writeBatch,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const me=await guard("MANAGEMENT");shell(me,NAV.MANAGEMENT,"exam");hero(me);

// ---------- helpers ----------
const $$=s=>[...document.querySelectorAll(s)],LET="ABCDEFGHIJ";
const CHT="abcdefghjkmnpqrstuvwxyz23456789",tok=()=>Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>CHT[b%CHT.length]).join("").toUpperCase();
const fdt=t=>t?new Date(t).toLocaleString([],{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"-";
const hms=ms=>{const s=Math.max(0,Math.round(ms/1e3)),d=Math.floor(s/86400);return(d?d+"d ":"")+[Math.floor(s%86400/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,"0")).join(":")};
const toLocal=t=>new Date(t-new Date(t).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const renderMath=el=>window.renderMathInElement&&renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false},{left:"\\[",right:"\\]",display:true}],throwOnError:false});
const clean=h=>{const r=new DOMParser().parseFromString(`<div>${h||""}</div>`,"text/html").body.firstChild;r.querySelectorAll("script,style,iframe,object,embed,link,meta,form").forEach(e=>e.remove());r.querySelectorAll("*").forEach(e=>[...e.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith("on")||(["href","src"].includes(n)&&/^(javascript|data:text|vbscript)/.test(v)))e.removeAttribute(a.name)}));return r.innerHTML};
const mo=(h,w)=>{$("#mo").innerHTML=`<div class="card ${w?"wd":""}">${h}</div>`;$("#mo").classList.add("show")},cmo=()=>$("#mo").classList.remove("show");
$("#mo").onclick=e=>{if(e.target.id=="mo"||e.target.closest("[data-x]"))cmo()};
const dl=(name,rows)=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`,a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}));a.download=name;a.click()};
function parseCSV(t){t=t.replace(/^\uFEFF/,"");const f=t.split(/\r?\n/)[0],dm=(f.match(/;/g)||[]).length>(f.match(/,/g)||[]).length?";":",",rows=[];let r=[],c="",q=false;
for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==dm){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}

// ---------- grading (answers are keyed by question id: mcq = option index, complex = array of indices, short = text) ----------
const has=v=>v!=null&&v!==""&&!(Array.isArray(v)&&!v.length);
function gradeQ(q,v){if(!has(v))return{pts:0,ok:false,ans:false};
if(q.type=="short"){const s=String(v).trim(),A=q.answers||[];let ok;
if(q.mode=="number"){const n=+s.replace(",",".");ok=!isNaN(n)&&A.some(a=>Math.abs(+String(a).replace(",",".")-n)<=(q.tol||0)+1e-9)}
else if(q.mode=="exact")ok=A.some(a=>a.trim()===s);else{const nz=x=>x.trim().toLowerCase().replace(/\s+/g," ");ok=A.some(a=>nz(a)===nz(s))}
return{pts:ok?q.score:0,ok,ans:true}}
if(q.type=="mcq"){const ok=q.correct[0]===+v;return{pts:ok?q.score:0,ok,ans:true}}
const sel=new Set([].concat(v).map(Number)),cor=new Set(q.correct),r=[...sel].filter(x=>cor.has(x)).length,w=sel.size-r,ok=r==cor.size&&w==0;
return{pts:q.scoring=="partial"?+(q.score*Math.max(0,(r-w)/cor.size)).toFixed(2):ok?q.score:0,ok,ans:true}}
function grade(qs,a){let score=0,correct=0,wrong=0;qs.forEach(q=>{const g=gradeQ(q,(a||{})[q.id]);score+=g.pts;if(g.ans){g.ok?correct++:wrong++}});return{score:+score.toFixed(2),correct,wrong}}
const maxOf=p=>(p?.questions||[]).reduce((a,q)=>a+(+q.score||0),0);

// ---------- data ----------
let E=[],S=[],U=[],C=[],P=[],UM={},PM={},CS=null,CPK=null,subs=[],unsub=null,tick=null,tab="live",RF={cls:""},IM=[];
const w=where("createdBy","==",me.uid);
async function loadAll(){try{const r=await Promise.all(["events","exam_sessions","users","classes","question_packages"].map(c=>getDocs(query(collection(db,c),w))));
const m=i=>r[i].docs.map(d=>({id:d.id,...d.data()}));E=m(0);S=m(1);U=m(2).filter(u=>["PARTICIPANT","PROCTOR"].includes(u.role));C=m(3).sort((a,b)=>a.name.localeCompare(b.name));P=m(4).map(p=>({questions:[],...p}));
UM=Object.fromEntries(U.map(u=>[u.id,u]));PM=Object.fromEntries(P.map(p=>[p.id,p]))}catch(x){toast(errMsg(x))}}
const sst=s=>{const n=Date.now();return n<s.startTime?"Upcoming":n>s.endTime?"Finished":"Live"};
const stTag=s=>{const x=sst(s);return`<span class="tag ${x=="Live"?"g":x=="Upcoming"?"a":""}">${x}</span>`};
const showHero=b=>$("#hero").style.display=$("#stats").style.display=b?"":"none";
const evOf=id=>E.find(e=>e.id==id);
const partsOf=s=>(s.assignedParticipantUids||[]).map(id=>UM[id]).filter(Boolean);

// ---------- routing ----------
async function route(){const h=location.hash;let m;
if(m=h.match(/^#\/session\/([^/]+)(?:\/(\w+))?$/)){if(CS&&CS.id==m[1]&&unsub){tab=m[2]||"live";return drawSess()}await loadAll();return viewSession(m[1],m[2]||"live")}
leave();await loadAll();if(m=h.match(/^#\/event\/(.+)$/))return viewEvent(m[1]);return viewEvents()}
function leave(){unsub&&unsub();unsub=null;clearInterval(tick);CS=null;subs=[]}
addEventListener("hashchange",route);

// ---------- events ----------
function viewEvents(){showHero(true);const up=S.filter(s=>sst(s)=="Upcoming").length,lv=S.filter(s=>sst(s)=="Live").length;
$("#stats").innerHTML=[["Events",E.length],["Sessions",S.length],["Live now",lv],["Upcoming",up]].map(([l,v],i)=>`<div class="st" style="animation-delay:${i*60}ms"><b>${v}</b><span>${l}</span></div>`).join("");
$("#v").innerHTML=`<div class="rw" style="margin-bottom:16px"><input id="eq" placeholder="Search events…" style="max-width:320px"><span style="flex:1"></span><button class="btn p" data-a="ne">＋ New event</button></div><div class="pg" id="eg"></div>`;$("#eq").oninput=drawEvents;drawEvents()}
const logo=(x,s=44)=>x.logoUrl?`<img class="av" style="width:${s}px;height:${s}px" src="${esc(x.logoUrl)}" alt="">`:`<div class="av" style="width:${s}px;height:${s}px">${esc((x.title||"?")[0].toUpperCase())}</div>`;
function drawEvents(){const q=($("#eq")?.value||"").toLowerCase(),L=E.filter(e=>e.title.toLowerCase().includes(q)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
$("#eg").innerHTML=L.map(e=>{const ss=S.filter(s=>s.eventId==e.id).sort((a,b)=>a.startTime-b.startTime),nx=ss.find(s=>sst(s)!="Finished");
return`<div class="card pk"><div class="rw">${logo(e)}<h3>${esc(e.title)}</h3></div><p class="mt">${esc(e.description||"No description")}</p><div class="mt">${ss.length} session(s)${nx?` · next: ${esc(nx.title)} (${fdt(nx.startTime)})`:""}</div><div class="rw" style="margin-top:auto;flex-wrap:wrap"><button class="btn s p" data-a="oe" data-id="${e.id}">Open</button><button class="btn s" data-a="ee" data-id="${e.id}">Edit</button><button class="btn s x" data-a="de" data-id="${e.id}">Delete</button></div></div>`}).join("")||`<div class="card" style="grid-column:1/-1"><p class="em">${E.length?"No events match.":"No events yet. Create your first exam event."}</p></div>`}
function eventForm(e){const v=e||{title:"",description:"",logoUrl:""};let lg;
mo(`<h3>${e?"Edit event":"New event"}</h3><form id="ef" novalidate><label for="et">Event title</label><input id="et" value="${esc(v.title)}" required><label for="edc">Description</label><textarea id="edc">${esc(v.description)}</textarea><label for="elg">Logo (optional)</label><input id="elg" type="file" accept="image/*"><label style="display:flex;gap:8px;align-items:center"><input id="erm" type="checkbox"> Remove current logo</label><div class="rw" style="margin-top:16px"><button type="button" class="btn" data-x style="flex:1">Cancel</button><button class="btn p" style="flex:1">Save</button></div></form>`);
$("#ef").onsubmit=async ev=>{ev.preventDefault();const t=$("#et").value.trim();if(!t)return toast("Title is required.");
try{const d={title:t,description:$("#edc").value.trim(),logoUrl:v.logoUrl||""},f=$("#elg").files[0];if(f)d.logoUrl=await logoData(f);else if($("#erm").checked)d.logoUrl="";
if(e)await updateDoc(doc(db,"events",e.id),d);else{const r=doc(collection(db,"events"));await setDoc(r,{id:r.id,...d,createdBy:me.uid,createdAt:Date.now()})}cmo();toast("Saved.");await route()}catch(x){toast(errMsg(x))}}}

// ---------- event detail (sessions) ----------
function viewEvent(id){const e=evOf(id);if(!e){toast("Event not found.");location.hash="";return}showHero(false);
const ss=S.filter(s=>s.eventId==id).sort((a,b)=>a.startTime-b.startTime);
$("#v").innerHTML=`<div class="hd"><button class="btn s" data-a="home">← Events</button>${logo(e,40)}<div style="flex:1;min-width:200px"><h2>${esc(e.title)}</h2><small style="color:var(--mu)">${esc(e.description||"")}</small></div><button class="btn s" data-a="ee" data-id="${e.id}">Edit event</button><button class="btn p" data-a="ns" data-id="${e.id}">＋ New session</button></div>
<div class="pg">${ss.map(s=>`<div class="card pk"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(s.title)}</h3><span>${stTag(s)}${s.resultsPublished?' <span class="tag g">Results published</span>':""}</span></div>
<div class="mt">📦 ${esc(PM[s.packageId]?.title||"Package removed")}</div><div class="mt">🗓 ${fdt(s.startTime)} → ${fdt(s.endTime)} · ${s.durationMinutes} min</div><div class="mt">👥 ${(s.assignedParticipantUids||[]).length} participants · 🛡 ${(s.assignedProctorUids||[]).map(u=>esc(UM[u]?.name||"?")).join(", ")||"no proctor"}</div>
<div class="mt">🔑 Token: <b class="mono" id="t${s.id}" data-t="${esc(s.token)}">••••••</b> <button class="btn s" data-a="tk" data-id="${s.id}">Show</button> <button class="btn s" data-a="cp" data-id="${s.id}">Copy</button></div>
<div class="rw" style="margin-top:auto;flex-wrap:wrap"><button class="btn s p" data-a="os" data-id="${s.id}">Monitor</button><button class="btn s" data-a="or" data-id="${s.id}">Results</button><button class="btn s" data-a="es" data-id="${s.id}">Edit</button><button class="btn s" data-a="ds" data-id="${s.id}">Duplicate</button><button class="btn s x" data-a="xs" data-id="${s.id}">Delete</button></div></div>`).join("")||'<div class="card" style="grid-column:1/-1"><p class="em">No sessions yet. Create the first one with “New session”.</p></div>'}</div>`}

// ---------- session form ----------
async function sessForm(eid,s){const pubs=P.filter(p=>p.status=="published"),ed=!!s;
if(!pubs.length&&!ed)return toast("Publish a question package first (Questions page).");
let locked=false;if(ed){try{locked=!(await getDocs(query(collection(db,"exam_submissions"),where("sessionId","==",s.id)))).empty}catch{}}
const st0=Math.ceil((Date.now()+36e5)/36e5)*36e5,v=s||{title:"",description:"",packageId:pubs[0].id,durationMinutes:pubs[0].durationMinutes||60,startTime:st0,endTime:st0+72e5,token:tok(),assignedProctorUids:[],classIds:[],violationRules:{tab:true,copy:true,shot:true}};
const clsM=new Set((C.filter(c=>(v.classIds||[]).includes(c.id))).flatMap(c=>c.studentUids||[])),ind=new Set(v.individualUids||(v.assignedParticipantUids||[]).filter(u=>!clsM.has(u))),PA=U.filter(u=>u.role=="PARTICIPANT"),PR=U.filter(u=>u.role=="PROCTOR"),vr=v.violationRules||{};
const pk=ed&&!PM[v.packageId]?[]:pubs.concat(ed&&PM[v.packageId]&&PM[v.packageId].status!="published"?[PM[v.packageId]]:[]);
mo(`<h3>${ed?"Edit session":"New session"}</h3><form id="sf" novalidate>
<div class="f2"><div><label for="sn">Session name</label><input id="sn" value="${esc(v.title)}" required></div><div><label for="sp">Question package</label><select id="sp" ${locked?"disabled":""}>${pk.map(p=>`<option value="${p.id}" data-d="${p.durationMinutes}" ${p.id==v.packageId?"selected":""}>${esc(p.title)} (${p.questions.length} q · ${maxOf(p)} pts)</option>`).join("")}</select>${locked?'<small style="color:var(--y)">Locked: this session already has results.</small>':""}</div></div>
<label for="sd">Description</label><textarea id="sd" rows="2">${esc(v.description||"")}</textarea>
<div class="f2"><div><label for="ss">Start</label><input id="ss" type="datetime-local" value="${toLocal(v.startTime)}" required></div><div><label for="se">Hard end (mandatory)</label><input id="se" type="datetime-local" value="${toLocal(v.endTime)}" required></div><div><label for="su">Duration per participant (minutes)</label><input id="su" type="number" min="1" value="${v.durationMinutes}"></div><div><label for="st">Security token</label><div class="rw"><input id="st" value="${esc(v.token)}" class="mono" style="text-transform:uppercase"><button type="button" class="btn s" id="sg">Generate</button></div></div></div>
<label>Proctors</label><div class="ck">${PR.map(u=>`<label><input type="checkbox" data-pr="${u.id}" ${(v.assignedProctorUids||[]).includes(u.id)?"checked":""}>${esc(u.name)}</label>`).join("")||'<small style="color:var(--mu)">No proctors yet (Accounts page). You can still monitor as Management.</small>'}</div>
<label>Participants · classes</label><div class="ck">${C.map(c=>`<label><input type="checkbox" data-cl="${c.id}" ${(v.classIds||[]).includes(c.id)?"checked":""}>${esc(c.name)} (${(c.studentUids||[]).length})</label>`).join("")||'<small style="color:var(--mu)">No classes yet.</small>'}</div>
<label>Participants · individuals</label><input id="si" placeholder="Search participants…"><div class="rw" style="margin:6px 0"><button type="button" class="btn s" id="sa">Select all shown</button><button type="button" class="btn s" id="sx">Clear individuals</button><b id="sn2" style="margin-left:auto"></b></div>
<div class="sl" id="sl">${PA.map(u=>`<label data-n="${esc((u.name+" "+(u.loginId||"")+" "+(u.institution||"")).toLowerCase())}"><input type="checkbox" data-ind="${u.id}" ${ind.has(u.id)?"checked":""}><span>${esc(u.name)} <small style="display:inline;color:var(--mu)">${esc(u.loginId||"")} · ${esc(u.institution||"-")}</small></span></label>`).join("")||'<small style="color:var(--mu)">No participants yet.</small>'}</div>
<label>Integrity rules (violation = exam locked for 60 seconds and logged)</label><div class="ck"><label><input type="checkbox" id="r1" ${vr.tab!==false?"checked":""}>Opening another tab / app</label><label><input type="checkbox" id="r2" ${vr.copy!==false?"checked":""}>Copy · paste · right-click</label><label><input type="checkbox" id="r3" ${vr.shot!==false?"checked":""}>Screenshot keys</label><label><input type="checkbox" id="r4" ${vr.fullscreen!==false?"checked":""}>Force full screen</label></div>
<div class="rw" style="margin-top:18px"><button type="button" class="btn" data-x style="flex:1">Cancel</button><button class="btn p" style="flex:1">${ed?"Save changes":"Create session"}</button></div></form>`,true);
const tgt=()=>{const cl=$$("[data-cl]:checked").map(i=>i.dataset.cl),id=$$("[data-ind]:checked").map(i=>i.dataset.ind),set=new Set(id);C.filter(c=>cl.includes(c.id)).forEach(c=>(c.studentUids||[]).forEach(u=>set.add(u)));return{cl,ind:id,all:[...set].filter(u=>UM[u]?.role=="PARTICIPANT")}};
const cnt=()=>$("#sn2").textContent=tgt().all.length+" participants in total";cnt();$("#sf").addEventListener("change",cnt);
$("#sp").onchange=e=>{$("#su").value=e.target.selectedOptions[0].dataset.d||$("#su").value};$("#sg").onclick=()=>$("#st").value=tok();
$("#si").oninput=e=>{const q=e.target.value.toLowerCase();$$("#sl label").forEach(l=>l.style.display=l.dataset.n.includes(q)?"flex":"none")};
$("#sa").onclick=()=>{$$("#sl label").filter(l=>l.style.display!="none").forEach(l=>l.querySelector("input").checked=true);cnt()};$("#sx").onclick=()=>{$$("[data-ind]").forEach(i=>i.checked=false);cnt()};
$("#sf").onsubmit=async e=>{e.preventDefault();const t=tgt(),a=new Date($("#ss").value).getTime(),b=new Date($("#se").value).getTime(),dur=Math.max(1,+$("#su").value||0),tk=$("#st").value.trim().toUpperCase();

const prev=()=>{check();const ok=IM.filter(r=>!r.err);$("#ip").innerHTML=IM.length?`<p style="margin:14px 0 8px"><b>${ok.length}</b> ready · <span class="bad">${IM.length-ok.length} skipped</span></p><div class="tw" style="max-height:280px;overflow:auto"><table><thead><tr><th>Row</th><th>ID</th><th>Participant</th><th>Score</th><th>Check</th></tr></thead><tbody>${IM.slice(0,300).map(r=>`<tr><td>${r.line}</td><td class="mono">${esc(r.id)}</td><td>${esc(r.u?.name||"-")}</td><td>${isNaN(r.score)?"-":r.score}</td><td class="${r.err?"bad":r.warn?"wn":"ok"}">${esc(r.err||r.warn||"OK")}</td></tr>`).join("")}</tbody></table></div><button class="btn p w" id="ig" ${ok.length?"":"disabled"}>Import ${ok.length} result(s)</button>`:""};
$("#iow").onchange=prev;
$("#icv").onchange=async e=>{const f=e.target.files[0];if(!f)return;const rows=parseCSV(await f.text()),hd=(rows[0]||[]).map(h=>h.trim().toLowerCase()),ix=(...n)=>hd.findIndex(h=>n.includes(h)),c={i:ix("id","login id","username","email"),s:ix("score","points","total"),c:ix("correct"),w:ix("wrong"),n:ix("notes","note")};
if(rows.length<2||c.i<0||c.s<0){IM=[];$("#ip").innerHTML='<p class="em bad">The file needs a header row with “ID” and “Score”, plus at least one data row.</p>';return}
IM=rows.slice(1).map((r,k)=>{const g=i=>i<0?"":(r[i]||"").trim(),num=i=>g(i)===""?null:+g(i).replace(",",".");return{line:k+2,id:g(c.i).toLowerCase(),score:g(c.s)===""?NaN:+g(c.s).replace(",","."),c:num(c.c),w:num(c.w),note:g(c.n)}});prev()};
$("#ip").onclick=async e=>{if(e.target.id!="ig")return;const ok=IM.filter(r=>!r.err);if(!ok.length)return;e.target.disabled=true;
try{for(let i=0;i<ok.length;i+=400){const bt=writeBatch(db);ok.slice(i,i+400).forEach(r=>{const id=`${CS.id}_${r.u.id}`,ex=subs.find(b=>b.id==id),d={id,sessionId:CS.id,participantUid:r.u.id,participantName:r.u.name,status:"submitted",score:r.score,correctCount:r.c??0,wrongCount:r.w??0,imported:true,manual:false,importNote:r.note,isBlocked:false,finishedAt:Date.now()};
if(!ex)Object.assign(d,{answers:{},marked:{},startedAt:CS.startTime,timeSpent:0,violationLogs:[],forceSubmit:false,notes:""});bt.set(doc(db,"exam_submissions",id),d,{merge:true})});await bt.commit()}
toast(`${ok.length} result(s) imported.`);IM=[];$("#ip").innerHTML="";$("#icv").value=""}catch(x){toast(errMsg(x));e.target.disabled=false}}}

// ---------- start ----------
await route();ready();
</script></body></html>
